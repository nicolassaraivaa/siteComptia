<style>
.ca-all{animation:ca-float 3.4s ease-in-out infinite;transform-box:view-box;transform-origin:180px 300px}
.ca-tail{animation:ca-wag 1.8s ease-in-out infinite;transform-box:view-box;transform-origin:248px 282px}
.ca-glint{animation:ca-glint 4.5s ease-in-out infinite}
.ca-blink{animation:ca-blink 4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes ca-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes ca-wag{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(7deg)}}
@keyframes ca-glint{0%,55%{transform:translateX(0)}80%,100%{transform:translateX(230px)}}
@keyframes ca-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.ca-char{animation:ca-hop 1.3s cubic-bezier(.3,.7,.4,1) infinite;transform-box:view-box;transform-origin:180px 310px}
@keyframes ca-hop{0%,100%{transform:translateY(0) scale(1,1)}12%{transform:translateY(0) scale(1.04,.96)}40%{transform:translateY(-18px) scale(.98,1.03)}70%{transform:translateY(0) scale(1,1)}}
.ca-shadow{animation:ca-shadow 1.3s cubic-bezier(.3,.7,.4,1) infinite;transform-box:fill-box;transform-origin:center}
@keyframes ca-shadow{0%,12%,70%,100%{transform:scaleX(1);opacity:1}40%{transform:scaleX(.75);opacity:.6}}
.ca-sp{animation:ca-tw 1.3s ease-in-out infinite;transform-box:view-box}
.ca-sp2{animation-delay:.3s}.ca-sp3{animation-delay:.6s}
@keyframes ca-tw{0%,100%{transform:scale(.4) rotate(0);opacity:.2}50%{transform:scale(1.1) rotate(45deg);opacity:1}}
@media (prefers-reduced-motion:reduce){.ca-root *{animation:none!important}}
</style>
