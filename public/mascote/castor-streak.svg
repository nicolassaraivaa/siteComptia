<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" class="cs-root" role="img">
<style>
.cs-all{animation:cs-float 3.4s ease-in-out infinite;transform-box:view-box;transform-origin:180px 300px}
.cs-tail{animation:cs-wag 1.8s ease-in-out infinite;transform-box:view-box;transform-origin:248px 282px}
.cs-glint{animation:cs-glint 4.5s ease-in-out infinite}
.cs-blink{animation:cs-blink 4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes cs-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes cs-wag{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(7deg)}}
@keyframes cs-glint{0%,55%{transform:translateX(0)}80%,100%{transform:translateX(230px)}}
@keyframes cs-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.cs-char{animation:cs-jump 1s cubic-bezier(.3,.7,.4,1) infinite;transform-box:view-box;transform-origin:180px 310px}
@keyframes cs-jump{0%,100%{transform:translateY(0)}45%{transform:translateY(-12px)}}
.cs-flame{animation:cs-flick .45s ease-in-out infinite alternate;transform-box:view-box;transform-origin:180px 296px}
@keyframes cs-flick{0%{transform:scale(1,1) skewX(0)}100%{transform:scale(1.02,1.04) skewX(-2deg)}}
.cs-cf{animation:cs-fall 2.2s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes cs-fall{0%{transform:translateY(-90px) rotate(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(160px) rotate(220deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.cs-root *{animation:none!important}}
</style>
