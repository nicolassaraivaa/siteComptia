<style>
.ce-all{animation:ce-float 3.4s ease-in-out infinite;transform-box:view-box;transform-origin:180px 300px}
.ce-tail{animation:ce-wag 1.8s ease-in-out infinite;transform-box:view-box;transform-origin:248px 282px}
.ce-glint{animation:ce-glint 4.5s ease-in-out infinite}
.ce-blink{animation:ce-blink 4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes ce-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes ce-wag{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(7deg)}}
@keyframes ce-glint{0%,55%{transform:translateX(0)}80%,100%{transform:translateX(230px)}}
@keyframes ce-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.ce-tilt{animation:ce-tilt 3s ease-in-out infinite;transform-box:view-box;transform-origin:180px 205px}
@keyframes ce-tilt{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg)}}
.ce-drop{animation:ce-drop 2.4s ease-in infinite}
@keyframes ce-drop{0%,15%{transform:translateY(0);opacity:1}70%{transform:translateY(14px);opacity:0}71%{transform:translateY(-6px);opacity:0}100%{transform:translateY(0);opacity:1}}
@media (prefers-reduced-motion:reduce){.ce-root *{animation:none!important}}
</style>
