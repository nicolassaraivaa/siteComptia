<style>
.cl-all{animation:cl-float 3.4s ease-in-out infinite;transform-box:view-box;transform-origin:180px 300px}
.cl-tail{animation:cl-wag 1.8s ease-in-out infinite;transform-box:view-box;transform-origin:248px 282px}
.cl-glint{animation:cl-glint 4.5s ease-in-out infinite}
.cl-blink{animation:cl-blink 4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes cl-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes cl-wag{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(7deg)}}
@keyframes cl-glint{0%,55%{transform:translateX(0)}80%,100%{transform:translateX(230px)}}
@keyframes cl-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}

@media (prefers-reduced-motion:reduce){.cl-root *{animation:none!important}}
</style>
